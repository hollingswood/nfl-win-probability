name: Historical odds backfill

# One-time (resumable) download of 2020-2025 historical lines from The Odds API.
# Needs a PAID plan; ~76k credits for all six seasons. Start with dry_run to see the cost.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons, e.g. 2020-2025 or 2024,2025 (newest are fetched first)"
        default: "2020-2025"
      dry_run:
        description: "Only count snapshots and credits (spends nothing)"
        type: boolean
        default: true
      reserve:
        description: "Stop before the account drops below this many credits"
        default: "1000"

concurrency:
  group: odds-backfill
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download historical odds
        run: |
          ARGS="--seasons ${{ inputs.seasons }} --reserve ${{ inputs.reserve }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m nflpred.odds_history $ARGS
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"  # show progress lines live in the log
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit what was downloaded (also after a failure, so a re-run resumes)
        if: always() && inputs.dry_run == false
        run: |
          git config user.name "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add data/historical_odds || true
          git commit -m "Historical odds backfill (${{ inputs.seasons }})" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
