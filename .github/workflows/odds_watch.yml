name: Hourly odds watch

# Re-checks prices every hour (no retraining) for the tracks whose edge depends on catching soft
# prices before they move: moneyline v2 (soft vs sharp books) and forecast-wind unders, and for the
# window-based tracks (moneyline v4, Tuesday early unders, Friday receptions props).
# Research: such prices last ~5-6 hours, so hourly is enough. Cost ~9 credits per check, plus ~1 credit
# per game for receptions props (once at its window, again near kickoff if it has open paper bets).
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

concurrency:
  group: predictions
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pages: write
  id-token: write

env:
  # phone alerts: every configured channel gets every alert (nflpred/notify.py)
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
  PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Backup for the 7:10 AM Arizona daily full run (14:10 UTC, started by cron-job.org): the 2026-10-01..09
      # validation found that job missing on 8 of 9 days and GitHub's own 14:17 copy starting 4-7 hours late.
      # If no Weekly predictions run has done the work since 13:50 UTC, start one now.
      - name: Start the daily full run if it hasn't happened
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          import importlib.util
          spec = importlib.util.spec_from_file_location("dd", "scripts/dedupe_run.py"); dd = importlib.util.module_from_spec(spec); spec.loader.exec_module(dd)
          now = datetime.now(timezone.utc)
          if now.hour != 14:
              print("not the daily-backup hour"); raise SystemExit
          tok, repo = os.environ["GH_TOKEN"], os.environ["REPO"]
          since = now.replace(hour=13, minute=50, second=0, microsecond=0)
          runs = dd._get(f"{dd.API}/repos/{repo}/actions/workflows/weekly.yml/runs?created=%3E{since:%Y-%m-%dT%H:%M:%SZ}&per_page=30", tok).get("workflow_runs", [])
          if dd.decide(runs, lambda rid: dd._get(f"{dd.API}/repos/{repo}/actions/runs/{rid}/jobs", tok).get("jobs", []), 10**15, since):
              print("daily run already done or in progress"); raise SystemExit
          req = urllib.request.Request(f"{dd.API}/repos/{repo}/actions/workflows/weekly.yml/dispatches", method="POST",
                                       data=json.dumps({"ref": "main", "inputs": {"run_type": "daily"}}).encode(),
                                       headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"})
          urllib.request.urlopen(req, timeout=30)
          print("started the daily full run (backup)")
          PY
      - name: Refresh odds and run price-sensitive tracks
        run: python -m nflpred.pipeline watch
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Alert on new bets (only tracks that have passed validation write this file)
        if: hashFiles('output/alert_watch.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "New bets $(date -u +%FT%H%M)" --body-file output/alert_watch.md
      - name: AI news reader (logs injury/QB signals with first-seen time; no bets)
        continue-on-error: true
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then python -m nflpred.news_llm; else python -m nflpred.news_llm --probe; fi
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Futures snapshot (every 6 h, plus after starting-QB news; logging only)
        continue-on-error: true
        run: python -m nflpred.futures
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Futures line-shopping paper test (Super Bowl prices vs the all-book fair price)
        continue-on-error: true
        run: python -m nflpred.futures_value
        env:
          PYTHONPATH: src
      - name: Analyst picks logger (published picks with first-seen time; scored vs the close at season end)
        continue-on-error: true
        run: python -m nflpred.picks_log
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: College football odds snapshot (logging only; hourly Thu-Sat, every 3 h otherwise)
        continue-on-error: true
        run: python -m cfbpred.odds_live
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: College football AI news reader (logging only; same cadence as the college odds)
        continue-on-error: true
        run: python -m cfbpred.news
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Kalshi resting-order paper test (simulated maker bids; public Kalshi data, no key)
        continue-on-error: true
        run: python -m nflpred.kalshi_maker
        env:
          PYTHONPATH: src
      - name: College football page data (CFBD refresh every 2 h in game windows, else 12 h; ratings, this week's games)
        continue-on-error: true
        run: python -m cfbpred.pipeline
        env:
          PYTHONPATH: src
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Build dashboard
        run: python scripts/build_dashboard.py
        env:
          PYTHONPATH: src
      - name: Commit
        id: commit
        run: |
          git config user.name "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add history output/predictions.json output/cfb_predictions.json output/cfb_model.json output/cfb_features.parquet data/cfb 2>/dev/null || git add history output/predictions.json
          if git commit -m "Odds watch $(date -u +%FT%H%M)"; then
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true'
        with:
          path: site
      - name: Phone alert if this run failed
        if: failure()
        continue-on-error: true
        run: |
          python -m nflpred.notify "Hourly odds watch FAILED" "Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 4 --soft
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

  deploy:
    needs: watch
    if: needs.watch.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
