name: Test phone alert

# Sends one test push to the ntfy topic in the NTFY_TOPIC secret.
on:
  workflow_dispatch:

env:
  # phone alerts: every configured channel gets every alert (nflpred/notify.py)
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
  PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send test push
        run: |
          python -m nflpred.notify "NFL predictor: test alert" "If you can read this, phone alerts work. Paper bets, failed runs and finished backfills will arrive here." 3
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
