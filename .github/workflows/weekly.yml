name: Weekly predictions

concurrency:
  group: predictions
  cancel-in-progress: false

on:
  schedule:
    # Daily 14:17 UTC (7:17am Arizona; off the top of the hour, when GitHub delays or drops scheduled runs): fresh stats, news and a line snapshot every day.
    - cron: "17 14 * * *"
    # Fridays 20:37 UTC (1:37pm Arizona): after the final injury report (game statuses) posts.
    - cron: "37 20 * * 5"
    # Pre-kickoff news runs, ~75 min before each window (after inactives start posting).
    # UTC; covers both daylight time (Sep-early Nov) and standard time. GitHub may start
    # scheduled runs 5-20 min late, so these aim early.
    - cron: "45 15 * * 0"   # Sun 1:00pm ET games (EDT)
    - cron: "45 16 * * 0"   # Sun 1:00pm ET games (EST)
    - cron: "5 19 * * 0"    # Sun 4:05/4:25pm ET (EDT)
    - cron: "5 20 * * 0"    # Sun 4:05/4:25pm ET (EST)
    - cron: "5 23 * * 0,1,4"  # SNF / MNF / TNF (EDT)
    - cron: "5 0 * * 1,2,5"   # SNF / MNF / TNF (EST)
  # Also started by an outside scheduler (cron-job.org) through the GitHub API, because GitHub's
  # own schedule is best-effort and can skip runs. See README "Making sure it runs".
  workflow_dispatch:
    inputs:
      run_type:
        description: "manual = full run incl. Vegas comparison; daily / friday / gameday = scheduled kinds"
        type: choice
        options: [manual, daily, friday, gameday]
        default: manual

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.dedupe.outputs.skip }}
    steps:
      # Both GitHub's schedule and the outside scheduler fire at about the same times; whichever
      # starts second skips itself so odds-API credits aren't spent twice. Manual runs never skip.
      - name: Skip if another run already covered this slot
        id: dedupe
        if: github.event_name == 'schedule' || inputs.run_type != 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-40 minutes' +%Y-%m-%dT%H:%M:%SZ)
          n=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/weekly.yml/runs?created=%3E$since&per_page=20" |
            python3 -c "import json,sys; rs=json.load(sys.stdin).get('workflow_runs',[]); print(sum(r['id']<${{ github.run_id }} and r['conclusion'] in (None,'success') for r in rs))")
          echo "earlier runs in the last 40 min: $n"
          if [ "${n:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  predict:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests must pass before publishing
        run: pytest -q
      - name: Backtest gate (refreshes data; blocks publishing if the model regressed)
        run: python -m nflpred.pipeline gate
        env:
          PYTHONPATH: src
      - name: Retrain, predict, grade (+ live odds, kickoff weather, injury/depth-chart news)
        # Sleeper's full player list is pulled by the daily run and the Friday final-report run;
        # pre-kickoff runs use ESPN's per-game injury lists (lighter, polled often).
        run: |
          SOURCES="espn"
          case "${{ github.event.schedule }}|${{ inputs.run_type }}" in
            "17 14 * * *|"*|"37 20 * * 5|"*|"|manual"|"|daily"|"|friday"|"|") SOURCES="sleeper,espn" ;;
          esac
          echo "news sources: $SOURCES"
          python -m nflpred.pipeline update --no-refresh --news-sources "$SOURCES"
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Vegas comparison (blend test + betting simulation)
        # Weekly (Tuesday's daily run) or on manual runs; it re-runs the 2015-2025 comparison.
        if: github.event.schedule == '17 14 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          RT="${{ inputs.run_type }}"
          if [ "$RT" = "manual" ] || { [ "$RT" != "friday" ] && [ "$RT" != "gameday" ] && [ "$(date -u +%u)" = "2" ]; }; then
            python scripts/vs_vegas.py
          else
            echo "Vegas comparison runs on Tuesdays"
          fi
        env:
          PYTHONPATH: src
      - name: Build dashboard
        run: python scripts/build_dashboard.py
        env:
          PYTHONPATH: src
      - name: Commit predictions history
        run: |
          mkdir -p history
          cp output/predictions.json "history/predictions_$(date -u +%FT%H%M).json"
          git config user.name "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add history output/predictions.json output/backtest.json output/vs_vegas.json
          git commit -m "Weekly predictions $(date -u +%F)" || echo "no changes"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
      - name: Alert on new bets (only once the model has passed validation)
        if: hashFiles('output/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "New bets $(date -u +%F)" --body-file output/alert.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Phone alert if this run failed
        if: failure()
        continue-on-error: true
        run: |
          python -m nflpred.notify "Weekly predictions run FAILED" "Run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" 4 --soft
        env:
          PYTHONPATH: src
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
