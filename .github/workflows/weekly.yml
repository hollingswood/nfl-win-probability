name: Weekly predictions

concurrency:
  group: predictions
  cancel-in-progress: false

on:
  schedule:
    # Daily 14:17 UTC (7:17am Arizona; off the top of the hour, when GitHub delays or drops scheduled runs): fresh stats, news and a line snapshot every day.
    - cron: "17 14 * * *"
    # Fridays 20:37 UTC (1:37pm Arizona): after the final injury report (game statuses) posts.
    - cron: "37 20 * * 5"
    # Pre-kickoff news runs, ~75 min before each window (after inactives start posting).
    # UTC; covers both daylight time (Sep-early Nov) and standard time. GitHub may start
    # scheduled runs 5-20 min late, so these aim early.
    - cron: "45 15 * * 0"   # Sun 1:00pm ET games (EDT)
    - cron: "45 16 * * 0"   # Sun 1:00pm ET games (EST)
    - cron: "5 19 * * 0"    # Sun 4:05/4:25pm ET (EDT)
    - cron: "5 20 * * 0"    # Sun 4:05/4:25pm ET (EST)
    - cron: "5 23 * * 0,1,4"  # SNF / MNF / TNF (EDT)
    - cron: "5 0 * * 1,2,5"   # SNF / MNF / TNF (EST)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests must pass before publishing
        run: pytest -q
      - name: Backtest gate (refreshes data; blocks publishing if the model regressed)
        run: python -m nflpred.pipeline gate
        env:
          PYTHONPATH: src
      - name: Retrain, predict, grade (+ live odds, kickoff weather, injury/depth-chart news)
        # Sleeper's full player list is pulled by the daily run and the Friday final-report run;
        # pre-kickoff runs use ESPN's per-game injury lists (lighter, polled often).
        run: |
          SOURCES="espn"
          case "${{ github.event.schedule }}" in
            "17 14 * * *"|"37 20 * * 5"|"") SOURCES="sleeper,espn" ;;
          esac
          python -m nflpred.pipeline update --no-refresh --news-sources "$SOURCES"
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Vegas comparison (blend test + betting simulation)
        # Weekly (Tuesday's daily run) or on manual runs; it re-runs the 2015-2025 comparison.
        if: github.event.schedule == '17 14 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "2" ]; then
            python scripts/vs_vegas.py
          else
            echo "Vegas comparison runs on Tuesdays"
          fi
        env:
          PYTHONPATH: src
      - name: Build dashboard
        run: python scripts/build_dashboard.py
        env:
          PYTHONPATH: src
      - name: Commit predictions history
        run: |
          mkdir -p history
          cp output/predictions.json "history/predictions_$(date -u +%FT%H%M).json"
          git config user.name "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add history output/predictions.json output/backtest.json output/vs_vegas.json
          git commit -m "Weekly predictions $(date -u +%F)" || echo "no changes"
          git push
      - name: Alert on new bets (only once the model has passed validation)
        if: hashFiles('output/alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "New bets $(date -u +%F)" --body-file output/alert.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
