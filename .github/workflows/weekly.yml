name: Weekly predictions

concurrency:
  group: predictions
  cancel-in-progress: false

on:
  schedule:
    # Tuesdays 14:00 UTC (7am Arizona): after Monday Night Football, before lines settle.
    - cron: "0 14 * * 2"
    # Thursdays 14:00 UTC: refresh for QB/injury changes before TNF.
    - cron: "0 14 * * 4"
    # Pre-kickoff news runs, ~75 min before each window (after inactives start posting).
    # UTC; covers both daylight time (Sep-early Nov) and standard time. GitHub may start
    # scheduled runs 5-20 min late, so these aim early.
    - cron: "45 15 * * 0"   # Sun 1:00pm ET games (EDT) - full news pull incl. Sleeper
    - cron: "45 16 * * 0"   # Sun 1:00pm ET games (EST)
    - cron: "5 19 * * 0"    # Sun 4:05/4:25pm ET (EDT)
    - cron: "5 20 * * 0"    # Sun 4:05/4:25pm ET (EST)
    - cron: "5 23 * * 0,1,4"  # SNF / MNF / TNF (EDT)
    - cron: "5 0 * * 1,2,5"   # SNF / MNF / TNF (EST)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests must pass before publishing
        run: pytest -q
      - name: Backtest gate (refreshes data; blocks publishing if the model regressed)
        run: python -m nflpred.pipeline gate
        env:
          PYTHONPATH: src
      - name: Retrain, predict, grade (+ live odds, kickoff weather, injury/depth-chart news)
        # Sleeper's full player list is pulled on the Tue/Thu runs and the first Sunday run;
        # later pre-kickoff runs use ESPN's per-game injury lists (lighter, polled often).
        run: |
          SOURCES="espn"
          case "${{ github.event.schedule }}" in
            "0 14 * * 2"|"0 14 * * 4"|"45 15 * * 0"|"") SOURCES="sleeper,espn" ;;
          esac
          python -m nflpred.pipeline update --no-refresh --news-sources "$SOURCES"
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Vegas comparison (blend test + betting simulation)
        if: github.event.schedule == '0 14 * * 2' || github.event_name == 'workflow_dispatch'
        run: python scripts/vs_vegas.py
        env:
          PYTHONPATH: src
      - name: Build dashboard
        run: python scripts/build_dashboard.py
        env:
          PYTHONPATH: src
      - name: Commit predictions history
        run: |
          mkdir -p history
          cp output/predictions.json "history/predictions_$(date -u +%F).json"
          git config user.name "nfl-bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add history output/predictions.json output/backtest.json output/vs_vegas.json
          git commit -m "Weekly predictions $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
