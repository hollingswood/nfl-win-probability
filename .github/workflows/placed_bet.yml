name: Log placed bet

# Saves a bet you placed (the "I placed a bet" issue form) to history/placed_bets.json and closes the issue.
# Only issues opened by the repo owner are accepted.
on:
  issues:
    types: [opened, edited]

concurrency:
  group: placed-bets
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  log:
    if: contains(github.event.issue.labels.*.name, 'placed-bet') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # latest main when the job starts (a queued run's own snapshot goes stale while it waits)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Save the bet
        run: python -m nflpred.placed ingest
        env:
          PYTHONPATH: src
      - name: Commit
        run: |
          out=$(bash scripts/push_results.sh "Placed bet (issue #${{ github.event.issue.number }})" history/placed_bets.json) || { echo "$out"; exit 1; }
          echo "$out"
      - name: Rebuild the dashboard so the bet shows up now (not at the next hourly update)
        continue-on-error: true
        run: python scripts/build_dashboard.py
        env:
          PYTHONPATH: src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Confirm and close the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "$RUNNER_TEMP/placed_comment.md"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} || true

  deploy:
    needs: log
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub Pages deploys fail now and then on GitHub's side (2026-10-30: one OIDC token error, the re-run passed);
      # try once more after a short wait instead of failing the run
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
