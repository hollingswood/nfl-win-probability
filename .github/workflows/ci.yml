name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - run: pip install -r requirements.txt
      - name: Unit + leakage tests
        run: pytest -q
      - name: Backtest regression gate (fails if log loss worsens vs model_baseline.json)
        run: python -m nflpred.pipeline gate
        env:
          PYTHONPATH: src
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: output/backtest.json
