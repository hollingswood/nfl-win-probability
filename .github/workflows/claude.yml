name: Claude

# Mention @claude in an issue or PR comment to have Claude implement or review changes.
# Setup: run `/install-github-app` in Claude Code, or add ANTHROPIC_API_KEY as a repo secret.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ github.event_name == 'pull_request' && 'Review this PR against the rules in CLAUDE.md. Focus on data leakage, time-based validation, and whether the backtest gate still passes. Be concise.' || '' }}
