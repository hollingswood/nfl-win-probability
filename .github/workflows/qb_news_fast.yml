name: QB news check (15 min)

# QB-news speed paper track (qb_news_rules.json): read new injury/QB news every 15 minutes and, when a strict
# starting-QB call qualifies, fetch fresh odds once and log a paper bet before the spread moves half a point.
# No other track runs here. The hourly watch runs the same check too.
# GitHub drops most of these cron runs (they ran every 3-7 h), so the hourly watch also queues two checks
# (wait_minutes 12 and 27) when it finishes: with the watch itself that is a check about every 15-20 minutes.
on:
  schedule:
    - cron: "8,38,53 * * * *"
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: "Minutes to wait before checking (the wait holds no lock)"
        default: "0"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
  PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
  PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - run: sleep $(( ${{ inputs.wait_minutes || 0 }} * 60 ))
  qbnews:
    needs: wait
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No concurrency group on purpose: GitHub keeps only one waiting run per group, so a queued QB check could cancel a
    # waiting full run (it did, 2026-10-16). Instead the check stands aside while a full run or hourly watch is going
    # (they run the same QB check), and it never commits output/predictions.json (the watch refreshes it hourly).
    steps:
      - name: Stand aside if a full run or the hourly watch is queued or running
        id: busy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for wf in weekly.yml odds_watch.yml; do
            for st in queued in_progress; do
              c=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/runs?status=$st&per_page=1" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_count',0))")
              n=$((n + c))
            done
          done
          echo "busy=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] && echo "::notice title=QB news::a full run or the hourly watch is going; it runs this check itself, so this one stands aside" || true
      - uses: actions/checkout@v5
        if: steps.busy.outputs.busy != 'true'
        with:
          ref: main   # latest main when the job starts (a queued run's own snapshot goes stale while it waits)
      - uses: actions/setup-python@v6
        if: steps.busy.outputs.busy != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.busy.outputs.busy != 'true'
      - name: AI news reader
        if: steps.busy.outputs.busy != 'true'
        continue-on-error: true
        run: python -m nflpred.news_llm
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: QB-news paper track (fresh odds only when a signal qualifies)
        if: steps.busy.outputs.busy != 'true'
        id: qb
        run: python -m nflpred.qb_news
        env:
          PYTHONPATH: src
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Commit
        if: steps.busy.outputs.busy != 'true'
        id: commit
        run: |
          git checkout -- output/predictions.json 2>/dev/null || true    # the hourly watch owns this file
          bash scripts/push_results.sh "QB news check $(date -u +%FT%H%M)" history
