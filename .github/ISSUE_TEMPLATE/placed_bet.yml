name: I placed a bet
description: Log a real bet you placed. Everything is filled in from the paper bet; just type your stake. It is saved to history/placed_bets.json and scored on the dashboard.
title: "Placed: "
labels: ["placed-bet"]
body:
  - type: markdown
    attributes:
      value: "**Type your stake and submit.** Book and odds are filled in from the paper bet. Only if you got something different, fill in the *Different …* boxes below — they override the filled-in values."
  - type: input
    id: stake
    attributes:
      label: Stake ($)
      placeholder: "25"
    validations:
      required: true
  - type: input
    id: bet_id
    attributes:
      label: Bet ID
      description: Filled in for you. Leave blank for a bet no track made.
  - type: input
    id: pick
    attributes:
      label: Pick
      description: e.g. WAS ML, PHI -3.5, Under 47.5, Jake Ferguson Over 3.5 rec
    validations:
      required: true
  - type: input
    id: book
    attributes:
      label: Book
      description: Filled in from the paper bet (for a bet no track made, type where you placed it)
    validations:
      required: true
  - type: input
    id: odds
    attributes:
      label: Odds
      description: Filled in from the paper bet (for a bet no track made, type the American odds, e.g. +188 or -110, or a Kalshi price like 35c)
    validations:
      required: true
  - type: input
    id: alt_book
    attributes:
      label: Different book? (optional)
      description: Only if you placed it somewhere else. Overrides Book.
      placeholder: "e.g. DraftKings"
  - type: input
    id: alt_odds
    attributes:
      label: Different odds? (optional)
      description: Only if you got a different price. Overrides Odds.
      placeholder: "e.g. -115"
  - type: input
    id: point
    attributes:
      label: Different line? (optional)
      description: Only if your spread / total / prop number differs (e.g. 53.5 instead of 54.5).
      placeholder: "e.g. 53.5"
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
